      - name: Setup Postgres
        run: |
          sudo apt-get install -y postgresql
          sudo service postgresql start
          sudo su - postgres
          psql
          CREATE USER runner WITH CREATEDB SUPERUSER PASSWORD 'runner'
          
          \q
          exit

      - name: Create Odoo configuration
        run: |
          echo "[options]" > ~/odoo.conf
          echo "db_host = postgres" >> ~/odoo.conf
          echo "db_port = 5432" >> ~/odoo.conf
          echo "db_user = odoo18" >> ~/odoo.conf
          echo "db_password = runner" >> ~/odoo.conf
          echo "test_enable = True" >> ~/odoo.conf
          cd ~ && pwd
          cat odoo.conf

