on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ 'main' ]
    types: [opened, reopened]
jobs:
  push:
    if: github.event_name == 'push' && ${{ !startsWith(github.ref, 'refs/pull/') }}
    uses: ./.github/workflows/pre-commit-workflow-template.yml

  pull-request:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pre-commit-workflow-template.yml

