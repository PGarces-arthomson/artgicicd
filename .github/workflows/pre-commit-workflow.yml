name: pre-commit
on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ 'main' ]
    types: [opened, reopened]
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for open PRs
        id: check_pr
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}")
          OPEN_PRS=$(gh pr list --base "$BRANCH_NAME" --state open --json number | jq -r '.[] | .number')
                
          if [[ -n "$OPEN_PRS" ]]; then
            echo "::set-output name=has_open_pr::true"
          else
            echo "::set-output name=has_open_pr::false"
          fi

  #      env:
  #        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.16'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run push actions if PR is open
        if: steps.check_pr.outputs.has_open_pr == 'true'
        run: pre-commit run --all-files


  pull-request:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pre-commit-workflow-template.yml
