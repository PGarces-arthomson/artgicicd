on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ 'main' ]
    types: [opened, reopened]
jobs:
  push:
    if: github.event_name == 'push' && ${{ !startsWith(github.ref, 'refs/pull/') }}
    uses: ./.github/workflows/pre-commit-workflow-template.yml

  pull-request:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pre-commit-workflow-template.yml

  integration-test:
    runs-on: ubuntu-latest
    needs: [push]
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: odoo18
          POSTGRES_PASSWORD: odoo18 # Or your desired password
          POSTGRES_DB: odoo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-timeout 10s
    steps:
      - name: Get current working directory
        run: |
          WORKING_DIR_PATH=$(pwd)
          echo "Current working directory: $WORKING_DIR_PATH"
          echo "WORKING_DIR=$current_dir" >> $GITHUB_ENV

      - name: Check Postgres status
        run: |
          container_status=$(docker ps --filter name=postgres --format "{{.Names}}")
          echo "PostgreSQL container is running: $container_status"

      - name: Checkout ARTGI Repository
        uses: actions/checkout@v4
        with:
          path: artg-modules
          fetch-depth: 2
          ref: ${{ github.ref_name }}

      - name: Checkout Odoo 18
        uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: '18.0'
          fetch-depth: 0
          # /home/runner/work/artgicicd/artgicicd/odoo-18
          path: odoo-18

      - name: Checkout Odoo Enterprise 18
        uses: actions/checkout@v4
        with:
          repository: PGarces-arthomson/enterprise
          ref: '18.0'
          # Active Repo PAT
          token: ${{ secrets.ARTGI_CICD_PAT }}

          # /home/runner/work/artgicicd/artgicicd/odoo-enterprise-18
          path: odoo-enterprise-18

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.16'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r artg-modules/requirements.txt
          
      - name: Install development libraries and dependencies
        run: |
          sudo apt-get install -y python3-dev libxml2-dev libxslt1-dev zlib1g-dev libsasl2-dev libldap2-dev build-essential libssl-dev libffi-dev libmysqlclient-dev libjpeg-dev libpq-dev libjpeg8-dev liblcms2-dev libblas-dev libatlas-base-dev

      - name: Install Node Js and NPM
        run: |
          sudo apt-get install -y npm
          sudo npm install -g less less-plugin-clean-css
          sudo apt-get install -y node-less

      - name: Create Odoo configuration
        run: |
          echo "[options]" > odoo.conf
          echo "db_host = postgres" >> odoo.conf
          echo "db_port = 5432" >> odoo.conf
          echo "db_user = odoo18" >> odoo.conf
          echo "db_password = odoo18" >> odoo.conf
          echo "test_enable = True" >> odoo.conf

      - name: Run integration test
        run: |
          
          TEST_PATH="./path/to/your/module/tests" # Specify the path to your tests
          cd odoo-18
          ./odoo-bin -c ../odoo.conf -d odoo_test --addons-path=${WORKING_DIR}/odoo-18/addons,${WORKING_DIR}/odoo-18/odoo/addons,${WORKING_DIR}/odoo-enterprise-18 -i base --test-enable --stop-after-init
