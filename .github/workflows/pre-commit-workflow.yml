on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ 'main' ]
    types: [opened, reopened]
jobs:
  push:
    if: github.event_name == 'push' && ${{ !startsWith(github.ref, 'refs/pull/') }}
    uses: ./.github/workflows/pre-commit-workflow-template.yml

  pull-request:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pre-commit-workflow-template.yml
#  odoo-integration:
#    needs: [push]
#    uses: ./.github/workflows/odoo-integration-workflow.yml

  odoo-integration:
    runs-on: ubuntu-latest
    needs: [push]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          repository: PGarces-arthomson/enterprise
          ref: '18.0'
          token: ${{ secrets.ARTGI_CICD_PAT  }}
          path: odoo-enterprise-18

      - name: Show list directory
        run: |
          pwd
          ls -al
