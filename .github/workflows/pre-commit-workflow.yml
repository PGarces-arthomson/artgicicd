on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ 'main' ]
    types: [opened, reopened]
jobs:
  push:
    if: github.event_name == 'push' && ${{ !startsWith(github.ref, 'refs/pull/') }}
    uses: ./.github/workflows/pre-commit-workflow-template.yml

  pull-request:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pre-commit-workflow-template.yml

  Prepare-odoo-environment:
    runs-on: ubuntu-latest
    needs: [push]
    steps:

      - name: Checkout ARTGI Repository
        uses: actions/checkout@v4
        with:
          path: artg-modules
          fetch-depth: 2
          ref: ${{ github.ref_name }}

#      - name: Checkout Odoo 18
