name: odoo-integration
on: workflow_call
jobs:
  Prepare-odoo-environment:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout ARTGI Repository
        uses: actions/checkout@v4
        with:
          path: artg-module
          ref: ${{ github.ref_name }}

      - name: Checkout Odoo 18
        uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: '18.0'
          fetch-depth: 0
          # /home/runner/work/artgicicd/artgicicd/odoo-18
          path: odoo-18

      - name: Checkout Odoo Enterprise 18
        uses: actions/checkout@v4
        with:
          repository: PGarces-arthomson/enterprise
          ref: '18.0'
          # Active Repo PAT
          token: ${{ secrets.ARTGI_CICD_PAT  }}

          # /home/runner/work/artgicicd/artgicicd/odoo-enterprise-18
          path: odoo-enterprise-18

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.16'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r ./artgicicd/odoo-18/requirements.txt
      

